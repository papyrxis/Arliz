name: Arliz Build

on:
  workflow_call:
    inputs:
      version:
        description: Version label injected into the build.
        required: false
        type: string
        default: dev
    outputs:
      pdf-artifact:
        description: Artifact containing all successfully built volume PDFs.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify all volumes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout with shared Workspace
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go for gix and psx
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          # Arliz has no go.mod/go.sum; the explicit lock-scoped cache below
          # also stores the installed command binaries.
          cache: false

      - name: Record the resolved Go version
        id: go-version
        shell: bash
        run: echo "version=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules, build cache and pinned tools
        id: go-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: arliz-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ hashFiles('.ci/locks/go-tools.lock') }}

      - name: Install repository tooling
        shell: bash
        env:
          GO_TOOLS_CACHE_HIT: ${{ steps.go-tools-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # This file is intentionally data-only: exact module versions define
          # the cache key and make tool upgrades an explicit reviewed change.
          source .ci/locks/go-tools.lock
          : "${GIX_VERSION:?GIX_VERSION is required in .ci/locks/go-tools.lock}"
          : "${PSX_VERSION:?PSX_VERSION is required in .ci/locks/go-tools.lock}"
          tool_bin="$(go env GOPATH)/bin"
          if [[ "$GO_TOOLS_CACHE_HIT" != "true" || ! -x "$tool_bin/gix" || ! -x "$tool_bin/psx" ]]; then
            go install "github.com/m-mdy-m/gix/cmd/gix@${GIX_VERSION}"
            go install "github.com/m-mdy-m/psx/cmd/psx@${PSX_VERSION}"
          else
            echo "Restored gix ${GIX_VERSION} and psx ${PSX_VERSION} from the lock-scoped cache."
          fi
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Check gix release metadata
        run: gix version show

      - name: Run Pipeline LaTeX preset
        uses: m-mdy-m/pipeline/.github/actions/toolchain-quality@feat/toolchain-cache-locks
        with:
          language: latex
          working-directory: .
          stages: install,lint,build,test
          install-command: python -m pip install -e workspace
          lint-command: psx check --config psx.yml
          build-command: make build
          test-command: make test
          timeout-seconds: "3600"
          cache: "true"
          python-cache-dependency-path: workspace/pyproject.toml
          latex-setup-mode: install
          latex-packages-file: .ci/locks/texlive-packages.ubuntu-24.04.lock
        env:
          PROJECT_VERSION: ${{ inputs.version }}
          BUILD_DATE: ${{ github.run_started_at }}

      - name: Set PDF artifact name
        id: artifact
        shell: bash
        run: echo "name=arliz-pdfs-${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload all volume PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/*.pdf
          if-no-files-found: error
          retention-days: 30
