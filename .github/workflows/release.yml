name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: arliz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release PDFs
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download volume PDFs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.pdf-artifact }}
          path: dist/publications

      - name: Prepare deterministic release assets
        run: python scripts/prepare_release_assets.py dist/publications dist/release-assets

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          PREVIOUS="$(git tag --list 'v*' --sort=-version:refname | grep -v -F "$TAG" | head -1 || true)"
          if [[ -n "$PREVIOUS" ]]; then
            RANGE="${PREVIOUS}..${TAG}"
            SINCE="Changes since ${PREVIOUS}"
          else
            RANGE="$TAG"
            SINCE="Initial versioned release"
          fi
          COMMITS="$(git log "$RANGE" --oneline --no-merges | head -30 || true)"
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          files=""
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            files="${files}- [${name}](${REPO}/releases/download/${TAG}/${name})"$'\n'
          done < <(find dist/release-assets -type f -name '*.pdf' -print0 | sort -z)

          cat > release_body.md <<EOF
          ## Arliz ${TAG}

          **${SINCE}** — built on ${BUILD_TIME}

          ### Volume PDFs

          ${files:-No PDF assets were produced.}

          ### Changes

          ${COMMITS:-No commit summary available.}

          Full editorial history: [docs/CHANGELOG.md](${REPO}/blob/${TAG}/docs/CHANGELOG.md).
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist/release-assets -type f -name '*.pdf' | sort)
          test "${#assets[@]}" -eq 3
          args=(--title "Arliz ${GITHUB_REF_NAME}" --notes-file release_body.md --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" "${assets[@]}"
