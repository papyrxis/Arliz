project:
  type: book
  category: technical
  title: "Arliz"
  author: "Mahdi"
  email: "bitsgenix@gmail.com"
  date: "auto"
  url: "https://github.com/papyrxis/arliz"

build:
  engine: pdflatex
  bibtex: biber
  output_dir: build
  source: "2026_ARLIZ_Zero_to_Bit_Volume_1.tex"

version:
  source: git
  fallback: "dev"

components:
  - fonts
  - math
  - graphics
  - tables
  - hyperref
  - colors
  - layout
  - titles
  - pagestyles
  - env
  - index
  - bibliography
  - code
  - boxes
  - commands/base

features:
  toc: true
  index: true
  bibliography: true
  glossary: false
  appendix: true

frontmatter:
  - title
  - copyright

colors:
  scheme: technical

copyright:
  type: cc-by-sa
  year: "auto"
  holder: "m-mdy-m"

overrides:
  dir: "configs"
  # mode: replace   (default) — your file replaces the default component
  # mode: extend    — default component first, then your additions appended