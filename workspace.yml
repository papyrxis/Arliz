schema_version: 2

project:
  name: arliz
  type: collection
  title: "Arliz"
  author: "Mahdi"
  email: "bitsgenix@gmail.com"
  date: "auto"
  url: "https://github.com/papyrxis/arliz"
  languages: [en]

build:
  output_dir: build
  default_engine: pdflatex
  timeout_seconds: 3600

documents:
  vol1:
    type: book
    title: "ARLIZ — Zero to Bit"
    editions:
      en:
        source: .generated/vol1/main.tex
        working_directory: .
        engine: pdflatex
        output_name: ARLIZ_Zero_to_Bit_Volume_1
  vol2:
    type: book
    title: "ARLIZ — Silicon Horizon"
    editions:
      en:
        source: .generated/vol2/main.tex
        working_directory: .
        engine: pdflatex
        output_name: ARLIZ_Silicon_Horizon_Volume_2
  vol3:
    type: book
    title: "ARLIZ — Array Odyssey"
    editions:
      en:
        source: .generated/vol3/main.tex
        working_directory: .
        engine: pdflatex
        output_name: ARLIZ_Array_Odyssey_Volume_3

version:
  source: git
  fallback: "dev"

export:
  output_dir: build/export
  targets: []
  tag_limit: 5

components:
  - fonts
  - math
  - graphics
  - tables
  - hyperref
  - colors
  - layout
  - titles
  - pagestyles
  - env
  - index
  - bibliography
  - code
  - boxes
  - commands/base

features:
  toc: true
  index: true
  bibliography: true
  glossary: false
  appendix: true

frontmatter:
  - title
  - copyright

colors:
  scheme: technical

copyright:
  type: cc-by-sa
  year: "auto"
  holder: "m-mdy-m"

overrides:
  dir: "configs"
  mode: replace
